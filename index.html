<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><meta name="description" content="FMOnline — live internet radio from around the world."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="data:,"><title>FMOnline — FM, online!</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="brand"><span class="signal">◉</span><span>FM<span>Online</span></span></div><div class="live"><i></i> LIVE</div></header><section class="hero"><div class="dial"><div class="ticks"></div><div class="needle"></div><div class="dial-center"><strong id="freq">LIVE</strong><small>FM</small></div></div><div class="station"><p class="eyebrow">NOW PLAYING</p><h1 id="station">FMOnline</h1><p id="track">Choose a station and press play.</p><div class="meter"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div></section><section class="player"><audio id="audio" preload="none"></audio><button class="play" id="play" aria-label="Play">▶</button><div class="controls"><div class="slider-row"><span id="elapsed">00:00</span><input id="progress" type="range" min="0" max="100" value="0"><span>LIVE</span></div><div class="volume"><span>VOL</span><input id="volume" type="range" min="0" max="1" step=".01" value=".8"></div></div></section><section class="country"><div><p class="eyebrow">COUNTRY DETECTOR</p><h2 id="country">Detecting country…</h2><p id="countryStatus">Using your approximate internet location.</p></div><div class="country-actions"><select id="countrySelect" aria-label="Choose a country"><option value="">Choose any country…</option></select><button id="detect" class="detect">Detect again</button></div></section><section class="tools"><div class="search-box"><input id="search" type="search" placeholder="Search stations worldwide…" autocomplete="off"><button id="searchButton">Search</button></div><div class="section-head"><h2>Stations</h2><span id="status">Ready to tune in</span></div><div class="cards"></div></section><section class="lists"><div><div class="section-head"><h2>Favorites</h2><span>Saved on this device</span></div><div id="favorites" class="mini-list"></div></div><div><div class="section-head"><h2>Recently played</h2><span>Last 8 stations</span></div><div id="recent" class="mini-list"></div></div></section><footer>FMOnline <span>•</span> FM, online!</footer></main><script src="app.js"></script></body></html>
