<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FMOnline — FM, online!</title>
<meta name="theme-color" content="#09090b">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header><div class="brand"><span class="signal">◉</span><span>FM<span>Online</span></span></div><div class="live"><i></i> LIVE</div></header>
<section class="hero">
<div class="dial"><div class="ticks"></div><div class="needle"></div><div class="dial-center"><strong id="freq">101.7</strong><small>FM</small></div></div>
<div class="station"><p class="eyebrow">NOW PLAYING</p><h1 id="station">FMOnline</h1><p id="track">Your favorite sound, online.</p><div class="meter"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
</section>
<section class="player">
<audio id="audio" preload="none"></audio>
<button class="play" id="play" aria-label="Play">▶</button>
<div class="controls"><div class="slider-row"><span>00:00</span><input id="progress" type="range" min="0" max="100" value="0"><span>LIVE</span></div><div class="volume"><span>VOL</span><input id="volume" type="range" min="0" max="1" step=".01" value=".8"></div></div>
</section>
<section class="country">
<div><p class="eyebrow">COUNTRY DETECTOR</p><h2 id="country">Detecting country…</h2><p id="countryStatus">Using your approximate internet location.</p></div>
<button id="detect" class="detect">Detect again</button>
</section>
<section class="stations">
<div class="section-head"><h2>Stations</h2><span id="status">Ready to tune in</span></div>
<div class="cards">
<button class="card active" data-name="FMOnline" data-freq="101.7" data-stream=""><b>101.7</b><span>FMOnline</span><small>MAIN RADIO</small></button>
<button class="card" data-name="Chill FM" data-freq="88.4" data-stream=""><b>88.4</b><span>Chill FM</span><small>CHILL</small></button>
<button class="card" data-name="Night FM" data-freq="94.8" data-stream=""><b>94.8</b><span>Night FM</span><small>NIGHT</small></button>
</div>
</section>
<footer>FMOnline <span>•</span> FM, online!</footer>
</main>
<script src="app.js"></script>
</body>
</html>
